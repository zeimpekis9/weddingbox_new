name: wedding-foundation
services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: wedding_migrator
      POSTGRES_DB: wedding_dev
      POSTGRES_PASSWORD: ${WEDDING_LOCAL_DB_PASSWORD:?Set WEDDING_LOCAL_DB_PASSWORD in .env.compose.local}
    ports:
      - "127.0.0.1:${WEDDING_LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - wedding_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding_migrator -d wedding_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  wedding_pgdata:
